<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>북부산성결교회</title>
<style>
:root{color-scheme:light;--bg:#f6f2ee;--card:#fff;--ink:#2b221d;--soft:#5d5048;--line:#e5dcd4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16120f;--card:#211b18;--ink:#f3ece6;--soft:#c3b5aa;--line:#3b312b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16120f;--card:#211b18;--ink:#f3ece6;--soft:#c3b5aa;--line:#3b312b}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:560px;margin:40px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
p{margin:6px 0}.soft{color:var(--soft)}
</style></head><body>
<main><div class="card"><h1 style="font-size:1.4rem;margin:0 0 8px">북부산성결교회</h1>
<p>이 주소는 받으신 개인 링크로만 쓰입니다.</p>
<p class="soft">링크를 잃어버리셨으면 담임목사님께 새 링크를 받아 주세요.</p></div></main>
</body></html>
