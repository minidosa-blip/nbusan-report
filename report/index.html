<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>북부산성결교회 보고</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- v9 = v7 + 명단에 새 이름 넣기(형님 11/08 1안). v7 구역장·부장 앱 = v6 + 명단의 모든 이름에 [출석][결석]을 고르는 방식(구역·부서 같음) + 구역·부서·모아보기 한 가지 색 톤(따뜻한 무채색 바탕·흰 카드·강조색 하나). 부서는 색이 아니라 이름표로만 구분한다. 색은 :root 토큰에서만 정한다. 이 파일에는 슬래시-별표 주석을 쓰지 않는다(앱스 스크립트가 지워서 화면이 잘린다). -->
<style>
  :root{color-scheme:light;--bg:#f6f2ee;--card:#ffffff;--ink:#2b221d;--soft:#5d5048;--line:#e5dcd4;--field:#fbf9f7;
    --acc:#a8402a;--acc-ink:#ffffff;--accbg:#f8ebe6;--accink:#8a3220;--shadow:0 1px 3px rgba(60,40,30,.07);--bar:rgba(255,255,255,.97)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16120f;--card:#211b18;--ink:#f3ece6;--soft:#c3b5aa;--line:#3b312b;--field:#1b1613;
    --acc:#ee9a80;--acc-ink:#2a140c;--accbg:#3a2620;--accink:#ffc6b4;--shadow:none;--bar:rgba(33,27,24,.97)}}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#16120f;--card:#211b18;--ink:#f3ece6;--soft:#c3b5aa;--line:#3b312b;--field:#1b1613;
    --acc:#ee9a80;--acc-ink:#2a140c;--accbg:#3a2620;--accink:#ffc6b4;--shadow:none;--bar:rgba(33,27,24,.97)}
  :root{--bg2:var(--field);--mint:var(--accink);--mintbg:var(--accbg);--sky:var(--soft);--skybg:var(--field);--lemon:var(--ink);--lemonbg:var(--field);--warn:var(--accink);--warnbg:var(--accbg);--focus:var(--acc)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
  .wrap{max-width:600px;margin:0 auto;padding:20px 16px calc(112px + env(safe-area-inset-bottom,0px))}
  .hero{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 18px}
  .hero svg{flex:none;width:60px;height:60px}
  h1{font-size:1.4rem;line-height:1.35;margin:0 0 2px;letter-spacing:-.02em}
  h2{font-size:1.2rem;line-height:1.4;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
  h3{font-size:1.05rem;margin:0 0 6px}
  .sub{color:var(--soft);font-size:1rem;margin:0}
  .pill{display:inline-block;margin-top:6px;font-size:1rem;font-weight:700;border-radius:8px;padding:2px 10px;background:var(--accbg);color:var(--accink)}
  .dept .pill{background:var(--mintbg);color:var(--mint)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 16px;box-shadow:var(--shadow);overflow-wrap:anywhere}
  label.t,.t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.08rem;margin:0 0 8px}
  .ico{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--field);border:1px solid var(--line);font-size:1.15rem;flex:none}
  .dept .ico{background:var(--mintbg)}
  .ico.sky{background:var(--skybg)}.ico.lemon{background:var(--lemonbg)}.ico.mint{background:var(--mintbg)}
  .hint{font-size:1rem;color:var(--soft);margin:-2px 0 10px}
  input[type=date],input[type=number],input[type=text],textarea,select{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);min-height:52px}
  textarea{min-height:96px;resize:vertical}
  textarea.s{min-height:64px}
  input::placeholder,textarea::placeholder{color:var(--soft);opacity:1}
  .mem{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:52px;border:1.5px solid var(--line);border-radius:16px;background:var(--field);cursor:pointer}
  .row.on{background:var(--accbg);border-color:var(--acc)}
  .dept .row.on{background:var(--mintbg);border-color:var(--mint)}
  .row input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc);flex:none}
  .dept .row input[type=checkbox]{accent-color:var(--mint)}
  .row .nm{flex:1;font-weight:600}
  .att{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--field)}
  .att .nm{font-weight:700;min-width:0}
  .att.is-p{border-color:var(--acc)}.att.is-a{border-color:var(--ink)}
  .att.unset{border-color:var(--acc);border-style:dashed;background:var(--accbg)}
  .att .reason{grid-column:1/-1;margin-top:0}
  .seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .seg label{position:relative;display:block}
  .seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .seg span{display:flex;align-items:center;justify-content:center;min-width:68px;min-height:48px;padding:0 10px;font-weight:800;font-size:17px;color:var(--soft)}
  .seg label+label span{border-left:1.5px solid var(--line)}
  .seg input:checked+span{background:var(--acc);color:var(--acc-ink)}
  .seg input[value=a]:checked+span{background:var(--ink);color:var(--card)}
  .seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
  .reason.need{border-color:var(--acc);background:var(--accbg)}
  .needhint{grid-column:1/-1;margin:-2px 0 0;font-size:1rem;color:var(--accink)}
  .reason{display:none;width:100%;margin-top:8px;font:inherit;font-size:17px;padding:10px 12px;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
  .reason.show{display:block}
  .wrapr{display:flex;flex-direction:column}
  .cnt{font-size:1rem;color:var(--ink);font-weight:700;margin-top:10px}
  .extra{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .xrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:16px}
  .xrow .xin{display:flex;flex-direction:column;gap:8px;min-width:0}
  .xrow input{font-size:17px}
  .ghost{width:auto;min-height:48px;font:inherit;font-size:16px;font-weight:700;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .ghost.add{margin-top:12px;color:var(--accink);border-color:var(--acc);background:var(--accbg)}
  .ghost.del{align-self:start;color:var(--soft)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .thumbs img{width:76px;height:76px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
  .thumbs .ph{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;font-size:14px;color:var(--soft);text-align:center}
  .thumbs .ph .wait,.thumbs .ph .bad{display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:14px;border:1.5px dashed var(--line);font-size:14px;line-height:1.3;padding:4px}
  .thumbs .ph .bad{border-color:var(--warn);color:var(--warn);background:var(--warnbg);font-weight:700}
  .thumbs .ph .ghost{min-height:44px;padding:6px 10px;font-size:15px}
  .phmsg{margin:8px 0 0;font-weight:600}.phmsg.err{color:var(--warn)}
  .send:disabled{opacity:.6;cursor:default}
  input[type=file]{font:inherit;font-size:16px;max-width:100%;color:var(--ink)}
  button.send{width:100%;min-height:60px;font:inherit;font-size:1.2rem;font-weight:800;padding:16px;border:0;border-radius:18px;background:var(--acc);color:var(--acc-ink);cursor:pointer;box-shadow:var(--shadow)}
  .dept button.send{background:var(--acc);color:var(--acc-ink)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:14px;padding:14px;border-radius:16px;display:none;font-weight:600}
  .msg.ok{display:block;background:var(--mintbg);color:var(--mint)}
  .msg.err{display:block;background:var(--warnbg);color:var(--warn)}
  .msg .ghost{margin-top:10px;display:block}
  .draft{display:none;background:var(--lemonbg);color:var(--lemon);border-radius:16px;padding:12px 14px;margin:0 0 16px;font-weight:600}
  .draft.show{display:block}
  .draft .ghost{margin-top:8px}
  .tip{font-size:1rem;color:var(--soft);margin-top:20px;text-align:center}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{border-radius:14px;padding:12px 10px;background:var(--field);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:84px}
  .dept .stat{background:var(--mintbg)}
  
  .stat .number{font-size:1.35rem;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .number.no{color:var(--warn)}
  @media (max-width:479px){.stats{grid-template-columns:minmax(0,1fr)}.stat{min-height:0;flex-direction:row-reverse;align-items:center;padding:12px 14px}.stat .number{text-align:right}}
  .stat .number small{font-size:1rem;color:var(--soft);font-weight:700}
  .stat .label{font-size:1rem;color:var(--soft);font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ok-mark{color:var(--mint)}
  .list{list-style:none;padding:0;margin:0}
  .list li{padding:12px 0;border-bottom:1px solid var(--line)}
  .list li:last-child{border-bottom:0}
  .list .why{display:block;color:var(--soft);font-size:1rem}
  .tag{display:inline-block;font-size:1rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--skybg);color:var(--sky);margin-left:4px;white-space:nowrap}
  .tag.hot{background:var(--warnbg);color:var(--warn)}
  .tag.edit{background:var(--lemonbg);color:var(--lemon)}
  .urgent{background:var(--warnbg);border-left:5px solid var(--warn);padding:12px 14px;border-radius:14px;margin-top:10px}
  .urgent strong{color:var(--warn)}
  .field{padding:12px 14px;background:var(--field);border:1px solid var(--line);border-radius:16px;margin-top:10px}
  .field h4{font-size:1rem;color:var(--soft);margin:0 0 4px;font-weight:800}
  .dept .field h4{color:var(--mint)}
  .field p{white-space:pre-wrap;margin:0}
  .empty{text-align:center;padding:28px 18px}
  .empty .big{font-size:2.2rem;display:block}
  .empty p{margin:6px 0}
  .loading{text-align:center;color:var(--soft);padding:36px 18px}
  .loading .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--acc);margin:0 4px;animation:b 1s infinite ease-in-out}
  .dept .loading .dot{background:var(--mint)}
  .loading .dot:nth-child(2){animation-delay:.15s}.loading .dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.loading .dot{animation:none}}
  svg.chart{display:block;width:100%;height:auto;color:var(--ink)}
  svg.chart text{fill:currentColor;font-family:inherit;font-size:13px}
  .axis{stroke:var(--line);stroke-width:1}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:1rem;color:var(--soft);margin:6px 0 4px}
  .legend i{display:inline-block;width:14px;height:14px;margin-right:6px;border-radius:4px;vertical-align:-2px;background:var(--acc)}
  .legend i.s{background:var(--acc)}.legend i.t{background:var(--soft)}.legend i.none{background:none;border:2px dashed var(--soft)}
  .photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .photos a{width:96px;font-size:1rem;color:var(--mint)}
  .photos img{display:block;width:96px;height:72px;object-fit:cover;border-radius:12px;background:var(--bg)}
  details.wk{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 0 12px;box-shadow:var(--shadow)}
  details.wk>summary{list-style:none;cursor:pointer;padding:14px 18px;min-height:64px;display:flex;align-items:center;gap:10px}
  details.wk>summary::-webkit-details-marker{display:none}
  details.wk>summary .when{flex:1;min-width:0}
  details.wk>summary .when b{display:block;font-size:1.1rem}
  details.wk>summary .when span{color:var(--soft);font-size:1rem}
  details.wk>summary .chev{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--bg2);transition:transform .2s}
  details.wk[open]>summary .chev{transform:rotate(180deg)}
  details.wk .body{padding:0 18px 16px}
  details.old{margin-top:14px;border-top:1px dashed var(--line);padding-top:6px}
  details.old>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--soft)}
  .ver{border-left:4px solid var(--line);padding:4px 0 4px 12px;margin-top:10px}
  .ver .when{color:var(--soft);font-size:1rem;font-weight:700}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(120,70,40,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tabbar button{font:inherit;font-size:16px;font-weight:700;line-height:1.25;color:var(--soft);background:none;border:0;border-radius:16px;min-height:64px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .tabbar button .e{font-size:1.4rem;line-height:1}
  .tabbar button[aria-selected="true"]{color:var(--accink);background:var(--accbg)}
  .dept .tabbar button[aria-selected="true"]{color:var(--mint);background:var(--mintbg)}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .dept :focus-visible{outline-color:var(--mint)}
  .row:focus-within{outline:3px solid var(--focus);outline-offset:2px}
  .dept .row:focus-within{outline-color:var(--mint)}
  .foot{font-size:1rem;color:var(--soft);margin:8px 4px 0}
  .addbox{margin-top:12px;padding:12px;border:1.5px dashed var(--acc);border-radius:16px}
  .addbox .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .addbox .btns .ghost{margin-top:0}
  .addmsg{margin:8px 0 0;font-size:1rem;font-weight:700;color:var(--accink)}
</style>
</head>
<body>
<div id="root"><div class="wrap" id="app"></div></div>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script>
// v12: 처음 값(REP)은 api.js가 열쇠(k)로 받아 온다. 열쇠가 틀리면 REP = null 이고 아래 화면이 '링크가 올바르지 않습니다'를 보인다.
NBAPI.start('report', 'boot', { k: NBAPI.param('k') }, function (REP) {
if (REP) document.title = REP.name + ' 보고';
// v12: google.script.run 과 같은 모양의 연결(api.js). 사진은 한 장씩 먼저 올리고 보고에는 사진 번호만 보낸다.
const google = { script: { run: NBAPI.runner({
  getMyOverview: (k, week) => NBAPI.get('report', 'overview', { k, week }),
  getMyHistory: k => NBAPI.get('report', 'history', { k }),
  addMember: p => NBAPI.post('report', 'addMember', p),
  submitReport: async p => {
    const photos = p.photos || [], ids = [];
    for (let i = 0; i < photos.length; i++) {
      const m = document.getElementById('msg');
      if (m) m.textContent = '사진 ' + (i + 1) + '/' + photos.length + ' 올리는 중…';
      const r = await NBAPI.post('report', 'photo', { k: p.k, sunday: p.sunday, i: i + 1, name: photos[i].name, type: photos[i].type, data: photos[i].data });
      // v13 (리뷰 R1 F2): 서버가 돌려준 사진 번호를 확인한다. 이상하면 여기서 멈추고, 쓰신 글과 고른 사진은 그대로 둔다.
      if (!r || typeof r.id !== 'string' || !/^[A-Za-z0-9_-]{10,}$/.test(r.id) || ids.indexOf(r.id) >= 0) throw new Error((i + 1) + '번째 사진을 올리지 못했습니다. [보고 보내기]를 다시 눌러 주세요. 쓰신 글은 그대로 있습니다.');
      ids.push(r.id);
    }
    const body = Object.assign({}, p, { photoIds: ids });
    delete body.photos;
    return NBAPI.post('report', 'submit', body);
  }
}) } };
const root = document.getElementById('root');
const app = document.getElementById('app');
// Owner 11/09: show '아무개 구역장' ('아무개 집사 (구역장)' -> '아무개 구역장').
const whoRole = w => { const m = String(w || '').trim().match(/^(\S+).*\((.+)\)$/); return m ? m[1] + ' ' + m[2] : ''; };
const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const ART_ZONE = '<svg viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="32" fill="var(--accbg)"/><path d="M16 33 34 18l18 15v17a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3Z" fill="var(--card)" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/><path d="M28 53V40h12v13" fill="var(--accbg)" stroke="var(--acc)" stroke-width="3"/><path d="M34 31c-2-3-7-2-6 2 1 3 6 5 6 5s5-2 6-5c1-4-4-5-6-2Z" fill="var(--acc)"/></svg>';
const ART_DEPT = '<svg viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="32" fill="var(--mintbg)"/><path d="M34 52V32" stroke="var(--mint)" stroke-width="4" stroke-linecap="round"/><path d="M34 34c0-9-7-14-15-13 0 9 7 14 15 13Z" fill="var(--mint)"/><path d="M34 30c0-8 6-13 14-12 0 8-6 13-14 12Z" fill="var(--card)" stroke="var(--mint)" stroke-width="3"/><ellipse cx="34" cy="53" rx="13" ry="4" fill="var(--mint)" opacity=".35"/></svg>';
const icon = (e, cls) => `<span class="ico${cls ? ' ' + cls : ''}" aria-hidden="true">${e}</span>`;
const FIELD = {progress:'🌱 진행사항',note:'💬 특이사항',suggest:'💡 건의사항',prayer:'🙏 기도제목',newcomer:'🐣 새 친구',event:'🎈 행사·예배 내용',plan:'🗓️ 사역 계획·다음 주 일정',teacherState:'🤝 교사들의 현재 상태',next:'📌 다음 주 일정·부탁',absence:'🧡 결석 이유',teacherZoneNote:'🍎 교사구역 나눔·기도제목'};
// v11 (형님 11/09): 210구역은 청년 보고 — 진행사항 칸이 오후 청년모임, 출석 이름은 오전예배.
const YOUTH_MEETING = '🌙 오후 청년모임 — 한 일·나눈 말씀';
const progressLabel = r => r && r.youth ? YOUTH_MEETING : FIELD.progress;
const youthCount = r => r && r.youth ? `<div class="field"><h4>⛪ 청년예배 출석 인원</h4><p>${r.youthWorship == null ? '<span style="color:var(--soft)">적지 않으셨습니다</span>' : r.youthWorship + '명'}</p></div>` : '';

function lastSunday() {
  const d = new Date(); d.setDate(d.getDate() - d.getDay());
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
// '2026-10-18' → '10월 18일 주일' (올해가 아니면 연도도)
function weekText(w, noSuffix) {
  const [y, m, d] = w.split('-').map(Number);
  return `${y !== new Date().getFullYear() ? y + '년 ' : ''}${m}월 ${d}일${noSuffix ? '' : ' 주일'}`;
}
const pct = n => n == null ? '—' : Math.round(n) + '%';

// v9 (형님 11/08 1안): 구역장·부장이 명단에 새 이름을 바로 넣는다. 넣은 이름은 담임목사님 열람실에 '새로 넣은 분'으로 보인다.

      <p class="addmsg" id="${id}_addmsg" role="status" aria-live="polite"></p></div>`;

const choiceOf = (id, i) => document.getElementById(`${id}_p${i}`).checked ? 'p' : document.getElementById(`${id}_a${i}`).checked ? 'a' : '';
function wireAttend(id, names) {
  if (!names.length) return;
  const count = () => {
    const c = names.map((_, i) => choiceOf(id, i));
    const p = c.filter(x => x === 'p').length, a = c.filter(x => x === 'a').length;
    document.getElementById(`${id}_cnt`).textContent = `출석 ${p} · 결석 ${a} · 미선택 ${names.length - p - a} / 명단 ${names.length}명`;
  };
  const paint = i => {
    const c = choiceOf(id, i), row = document.getElementById(`${id}_r${i}`), w = document.getElementById(`${id}_w${i}`);
    row.classList.toggle('is-p', c === 'p'); row.classList.toggle('is-a', c === 'a');
    if (c) row.classList.remove('unset');
    w.classList.toggle('show', c === 'a');
    const need = c === 'a' && !w.value.trim();
    w.classList.toggle('need', need); document.getElementById(`${id}_h${i}`).hidden = !need;
  };
  names.forEach((_, i) => {
    ['p', 'a'].forEach(v => document.getElementById(`${id}_${v}${i}`).addEventListener('change', () => { paint(i); count(); }));
    document.getElementById(`${id}_w${i}`).addEventListener('input', () => paint(i));
  });
  count();
}
function readAttend(id, names) {
  if (!names.length) {
    const t = document.getElementById(`${id}_txt`).value.trim();
    return { present: document.getElementById(`${id}_n`).value, total: '', absent: t ? [{ name: '(직접 기재)', reason: t }] : [], presentNames: [], unset: [] };
  }
  const c = names.map((_, i) => choiceOf(id, i));
  return { present: c.filter(x => x === 'p').length, total: names.length,
           presentNames: names.filter((_, i) => c[i] === 'p'),
           absent: names.map((n, i) => ({ n, i })).filter(o => c[o.i] === 'a')
                        .map(o => ({ name: o.n, reason: cleanReason(document.getElementById(`${id}_w${o.i}`).value) })),
           unset: names.map((_, i) => i).filter(i => !c[i]) };
}

let addExtraRow = null;
function wireZoneAbsent(names) {
  const extra = document.getElementById('za_extra');
  let n = 0;
  const count = () => { document.getElementById('za_cnt').textContent = `결석 ${readZoneAbsent(names).length}명`; };
  addExtraRow = (nm, rs) => {
    const i = n++;
    const div = document.createElement('div');
    div.className = 'xrow'; div.id = `za_x${i}`;
    div.innerHTML = `<div class="xin"><input type="text" id="za_xn${i}" aria-label="결석하신 분 이름" placeholder="이름"><input type="text" id="za_xr${i}" aria-label="결석 이유" placeholder="이유 (예: 병원, 여행)"></div><button type="button" class="ghost del" aria-label="이 줄 지우기">지우기</button>`;
    div.querySelector('.del').addEventListener('click', () => { div.remove(); count(); saveDraft(); const ad = document.getElementById('za_add'); if (ad) ad.focus(); });
    div.addEventListener('input', count);
    extra.appendChild(div);

  const zaAdd = document.getElementById('za_add'); if (zaAdd) zaAdd.addEventListener('click', () => { addExtraRow().querySelector('input').focus(); });
  if (!names.length) addExtraRow();

}
const cleanName = s => s.replace(/:/g, '·').replace(/\s*\/\s*/g, ' ').trim();
const cleanReason = s => s.replace(/\s+\/\s+/g, ', ').trim();
function readZoneAbsent(names) {
  const list = names.map((n, i) => ({ n, i })).filter(o => document.getElementById(`za_c${o.i}`).checked)
    .map(o => ({ name: o.n, reason: cleanReason(document.getElementById(`za_w${o.i}`).value) }));
  document.querySelectorAll('#za_extra .xrow').forEach(row => {
    const ins = row.querySelectorAll('input');
    const name = cleanName(ins[0].value), reason = cleanReason(ins[1].value);
    if (!name && !reason) return;
    list.push({ name: name || '(직접 기재)', reason });
  });
  return list;
}
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res({ name: file.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1], url: c.toDataURL('image/jpeg', 0.5) });
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function textCard(id, emoji, title, hint, placeholder, small) {

// 쓰던 내용 임시 저장 — 이 휴대폰 안에만, 보고 화면의 글만 저장한다. 보내기에 성공하면 지운다.
// 한눈에·지난 보고에서 받은 내용은 어디에도 저장하지 않는다.
const DRAFT_KEY = REP ? 'report-draft-v7:' + REP.k : '';
let draftTimer = null, draftReady = false;
function formEl() { return document.getElementById('p-report'); }
function saveDraft() {
  if (!draftReady || !REP) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(writeDraft, 400);
}
function writeDraft() {
  if (!draftReady || !REP) return;
  clearTimeout(draftTimer);
  {
    const d = { savedAt: Date.now(), values: {}, checks: {}, extra: [] };
    formEl().querySelectorAll('textarea[id],input[type=text][id]:not([id^=za_x]):not([id$=_addname]),input.reason[id],input[type=number][id],input[type=date][id]').forEach(el => { if (el.value) d.values[el.id] = el.value; });
    formEl().querySelectorAll('input[type=checkbox][id],input[type=radio][id]').forEach(el => { if (el.checked) d.checks[el.id] = true; });
    document.querySelectorAll('#za_extra .xrow').forEach(row => { const ins = row.querySelectorAll('input'); if (ins[0].value || ins[1].value) d.extra.push([ins[0].value, ins[1].value]); });
    const empty = !Object.keys(d.values).filter(k => k !== 'sunday').length && !Object.keys(d.checks).length && !d.extra.length;
    try { empty ? localStorage.removeItem(DRAFT_KEY) : localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch (_) {}
  }
}
function clearDraft() { clearTimeout(draftTimer); try { localStorage.removeItem(DRAFT_KEY); } catch (_) {} }
function restoreDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (_) { d = null; }
  if (!d || !d.savedAt || Date.now() - d.savedAt > 8 * 864e5) { clearDraft(); return false; }
  Object.keys(d.values || {}).forEach(id => { const el = document.getElementById(id); if (el && el.type !== 'file') el.value = d.values[id]; });
  Object.keys(d.checks || {}).forEach(id => { const el = document.getElementById(id); if (el && !el.checked) { el.checked = true; el.dispatchEvent(new Event('change')); } });
  if (addExtraRow && (d.extra || []).length) {
    const blanks = Array.from(document.querySelectorAll('#za_extra .xrow')).filter(r => !r.querySelector('input').value);
    blanks.forEach(r => r.remove());
    d.extra.forEach(([nm, rs]) => addExtraRow(nm, rs));
  }
  return true;
}

// 구역: 12주 결석 기록 막대. 보고 없는 주는 점선 표시(0으로 바꾸지 않는다).
function zoneChart(trend) {
  const W = 340, H = 200, L = 30, R = 8, T = 16, B = 34, pw = W - L - R, ph = H - T - B;
  const max = Math.max(3, ...trend.map(p => p.absentCount || 0));
  const step = max <= 4 ? 1 : Math.ceil(max / 4);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 12주 결석 기록 수 막대그래프">`;
  for (let v = 0; v <= max; v += step) { const y = T + ph * (1 - v / max); s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }
  const bw = pw / 12;
  trend.forEach((p, i) => {
    const x = L + bw * i + bw * 0.18, w = bw * 0.64;
    if (!p.reported) s += `<rect x="${x}" y="${T + ph - 18}" width="${w}" height="18" rx="5" fill="none" stroke="var(--soft)" stroke-width="1.5" stroke-dasharray="3 3"><title>${esc(weekText(p.week))} 보고 없음</title></rect>`;
    else {
      const h = ph * p.absentCount / max;
      s += `<rect x="${x}" y="${T + ph - h}" width="${w}" height="${Math.max(h, 0)}" rx="5" fill="var(--acc)"><title>${esc(weekText(p.week))} 결석 ${p.absentCount}명</title></rect>`;
      if (p.absentCount === 0) s += `<rect x="${x}" y="${T + ph - 3}" width="${w}" height="3" rx="1.5" fill="var(--acc)" opacity=".5"/>`;
    }
    if (i % 3 === 2 || i === 0) s += `<text x="${x + w / 2}" y="${H - 12}" text-anchor="middle">${esc(p.week.slice(5).replace('-', '/').replace(/^0/, ''))}</text>`;
  });
  return s + '</svg>';
}
// 부서: 12주 출석률 선(학생·교사). 보고 없거나 계산할 수 없는 주는 선을 잇지 않는다.
function deptChart(trend) {
  const W = 340, H = 210, L = 40, R = 10, T = 14, B = 34, pw = W - L - R, ph = H - T - B;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 12주 학생·교사 출석률 꺾은선그래프">`;
  [0, 50, 100].forEach(t => { const y = T + ph * (1 - t / 100); s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${t}%</text>`; });
  trend.forEach((p, i) => { if (i % 3 === 2 || i === 0) s += `<text x="${L + pw * i / 11}" y="${H - 12}" text-anchor="${i === 0 ? 'start' : i === 11 ? 'end' : 'middle'}">${esc(p.week.slice(5).replace('-', '/').replace(/^0/, ''))}</text>`; });
  [['studentRate', 'var(--mint)', '학생'], ['teacherRate', 'var(--sky)', '교사']].forEach(([k, color, label]) => {
    let seg = [];
    const flush = () => { if (seg.length > 1) s += `<polyline fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="${seg.join(' ')}"/>`; seg = []; };
    trend.forEach((p, i) => {
      const r = p[k]; if (r == null) { flush(); return; }
      const x = L + pw * i / 11, y = T + ph * (1 - Math.min(r, 100) / 100); seg.push(`${x},${y}`);
      s += `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--card)" stroke="${color}" stroke-width="3"><title>${esc(weekText(p.week))} ${label} ${pct(r)}</title></circle>`;
    });
    flush();
  });
  return s + '</svg>';
}

function renderOverview(d) {

function loadHistory() {
  const box = document.getElementById('p-history-body');
  box.innerHTML = loadingHtml('지난 보고를 불러오는 중입니다…');
  google.script.run
    .withSuccessHandler(d => { loaded.history = true; renderHistory(d); })
    .withFailureHandler(e => { box.innerHTML = errorHtml((e && e.message) || '불러오지 못했습니다.', 'history'); })
    .getMyHistory(REP.k);
}
function reportBody(r) {
  if (r.kind === '부서') {
    const a = r.attendance, t = r.teachers;
    return `<div class="field"><h4>🧒 아이들 출석</h4><p>${a.present == null ? '—' : a.present} / ${a.total == null ? '—' : a.total}명 · ${pct(a.rate)}</p></div>
      ${r.noTeacher ? '' : `<div class="field"><h4>🍎 선생님 출석</h4><p>${t.present == null ? '—' : t.present} / ${t.total == null ? '—' : t.total}명 · ${pct(t.rate)}</p></div>`}
      <div class="field"><h4>🧡 결석 (아이들)</h4>${absentListHtml(r.absent, '없음')}</div>

function renderHistory(d) {
  const box = document.getElementById('p-history-body');

  box.innerHTML = `<p class="hint" style="margin:0 4px 12px">주일을 누르면 그 주에 보내신 내용이 펼쳐집니다. 고쳐서 다시 보내신 주는 <span class="tag edit">수정됨</span> 표시가 있고, 처음 보낸 내용도 볼 수 있습니다.</p>` +
    d.weeks.map((w, i) => {
      const r = w.latest, n = r.absent.length + (r.teacherAbsent || []).length;

        <div class="body"><p class="hint" style="margin:0">${w.edited ? '마지막으로 보낸 내용' : '보낸 시각'} · ${esc(r.submittedAt || '시각 기록 없음')}</p>${reportBody(r)}

      const all = [...e.target.files], files = all.slice(0, 10);
      photos = files.map(f => ({ name: f.name, status: 'wait' }));
      photoNote = all.length > 10 ? `사진은 10장까지 올릴 수 있어 앞의 10장만 골랐습니다(고르신 사진 ${all.length}장).` : '';
      renderPhotos();
      for (let i = 0; i < files.length; i++) {
        let item;
        try { item = Object.assign({ status: 'ok' }, await shrink(files[i])); } catch (_) { item = { name: files[i].name, status: 'fail' }; }
        if (gen !== photoGen) return;   // 그사이 사진을 다시 고르셨다 — 이 결과는 버린다
        photos[i] = item;
        renderPhotos();
      }
    });
    document.getElementById('thumbs').addEventListener('click', e => {
      const rm = e.target.closest('[data-photo-rm]');
      if (!rm || photos.some(x => x.status === 'wait')) return;
      photos.splice(Number(rm.dataset.photoRm), 1);
      renderPhotos();
    });
  } else {
    if (members.length) wireAttend('z', members); else wireZoneAbsent([]);
  }
  // v9: 명단에 새 이름 넣기 — 넣고 나면 그 출석 칸만 다시 그리고, 이미 고른 출석·결석과 적은 글은 그대로 둔다.
  const TITLE = { z: ZONE_TITLE, m: icon('🧒') + (noTeacher ? '청년 출석' : '아이들 출석'), t: icon('🍎') + '교사 출석 (부서 교사구역)' };
  const HINT_NONE = { m: '명단이 아직 없습니다. 숫자로 적어 주세요.', t: '교사 명단이 아직 없습니다. 숫자로 적어 주세요.' };
  const NAMES = { z: members, m: members, t: teachers };
  app.addEventListener('click', e => {
    const open = e.target.closest('[data-addm-open]'), save = e.target.closest('[data-addm-save]'), cancel = e.target.closest('[data-addm-cancel]');
    if (open) { const id = open.dataset.addmOpen; document.getElementById(id + '_addbox').hidden = false; open.hidden = true; document.getElementById(id + '_addname').focus(); }
    if (cancel) { const id = cancel.dataset.addmCancel; document.getElementById(id + '_addbox').hidden = true; document.querySelector(`[data-addm-open="${id}"]`).hidden = false; }
    if (save) {
      const id = save.dataset.addmSave, input = document.getElementById(id + '_addname'), note = document.getElementById(id + '_addmsg');
      const name = input.value.replace(/[:\/]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!name) { note.textContent = '이름을 적어 주세요.'; input.focus(); return; }
      if (NAMES[id].includes(name)) { note.textContent = `「${name}」 님은 이미 명단에 있습니다.`; return; }
      save.disabled = true; note.textContent = '명단에 넣는 중…';
      google.script.run
        .withSuccessHandler(r => {
          writeDraft();
          NAMES[id].push(name);
          document.getElementById(id + '_card').outerHTML = attendBlock(id, TITLE[id], NAMES[id], HINT_NONE[id] || '');
          wireAttend(id, NAMES[id]);
          restoreDraft();
          document.querySelector(`[data-addm-open="${id}"]`).insertAdjacentHTML('beforebegin', `<p class="addmsg" role="status">✔ ${esc(r)} 위 명단 맨 아래에서 출석·결석을 골라 주세요.</p>`);
          const n = NAMES[id].length - 1, last = document.getElementById(`${id}_r${n}`);
          if (last) { last.scrollIntoView({ block: 'center' }); document.getElementById(`${id}_p${n}`).focus({ preventScroll: true }); }
        })
        .withFailureHandler(err => { save.disabled = false; note.textContent = (err && err.message) || '넣지 못했습니다. 잠시 후 다시 눌러 주세요.'; })
        .addMember({ k: REP.k, name, role: id === 't' ? '교사' : '' });
    }
  });
  if (restoreDraft()) document.getElementById('draft').classList.add('show');
  draftReady = true;
  formEl().addEventListener('input', saveDraft);
  formEl().addEventListener('change', saveDraft);
  document.getElementById('draft-clear').addEventListener('click', () => { clearDraft(); location.reload(); });

  TABS.forEach((t, i) => {
    const b = document.getElementById('tab-' + t);
    b.addEventListener('click', () => pickTab(t));
    b.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); pickTab(TABS[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3], true); } });
  });
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'), retry = e.target.closest('[data-retry]');
    if (go) pickTab(go.dataset.go);
    if (retry) retry.dataset.retry === 'overview' ? loadOverview('') : loadHistory();
  });

  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  document.getElementById('send').addEventListener('click', () => {
    const btn = document.getElementById('send'), msg = document.getElementById('msg');
    // v7: 명단의 이름은 모두 출석/결석을 골라야 보낼 수 있다. 고르지 않은 분을 알려 드리고 첫 분에게로 옮겨 간다.
    const blocks = isDept ? (noTeacher ? [['m', members]] : [['m', members], ['t', teachers]]) : (members.length ? [['z', members]] : []);
    const unset = [];
    blocks.forEach(([id, names]) => { if (names.length) readAttend(id, names).unset.forEach(i => unset.push({ id, i, name: names[i] })); });
    if (unset.length) {
      unset.forEach(u => document.getElementById(`${u.id}_r${u.i}`).classList.add('unset'));
      msg.className = 'msg err';
      msg.textContent = `아직 출석·결석을 고르지 않은 분이 ${unset.length}명 있습니다: ${unset.slice(0, 8).map(u => u.name).join(', ')}${unset.length > 8 ? ' 외' : ''}. 한 분씩 골라 주세요.`;
      const first = document.getElementById(`${unset[0].id}_r${unset[0].i}`);
      first.scrollIntoView({ block: 'center' });
      document.getElementById(`${unset[0].id}_p${unset[0].i}`).focus({ preventScroll: true });
      return;
    }
    // v13 (리뷰 R1 F1): 사진 준비가 끝나지 않았거나 읽지 못한 사진이 남아 있으면 보내지 않는다.
    if (isDept && photosPending()) {
      msg.className = 'msg err'; msg.textContent = '사진을 아직 준비하고 있습니다. 준비가 끝나면 다시 눌러 주세요.';
      return;
    }
    if (isDept && photosFailed().length) {
      msg.className = 'msg err'; msg.textContent = '읽지 못한 사진이 있습니다. 사진 칸에서 그 사진을 [빼기]로 빼거나 다른 사진으로 다시 골라 주세요.';
      document.getElementById('thumbs').scrollIntoView({ block: 'center' });
      return;
    }
    let p;
    if (isDept) {
      const m = readAttend('m', members), t = noTeacher ? { present: '', total: '', absent: [] } : readAttend('t', teachers);
      p = { k: REP.k, sunday: val('sunday'), present: m.present, total: m.total, absent: m.absent,
        tPresent: t.present, tTotal: t.total, tAbsent: t.absent,
        prayer: val('prayer'), note: val('note'), newcomer: val('newcomer'), next: val('next'),
        event: val('event'), plan: val('plan'), teacherState: val('teacherState'), suggest: val('suggest'), teacherZoneNote: val('teacherZoneNote'),
        photos: photos.filter(x => x.status === 'ok').map(x => ({ name: x.name, type: x.type, data: x.data })) };
    } else {
      const z = members.length ? readAttend('z', members) : { absent: readZoneAbsent([]), present: '', total: '', presentNames: [] };
      p = { k: REP.k, sunday: val('sunday'), absent: z.absent, present: z.present, total: z.total, presentNames: z.presentNames, progress: val('progress'), note: val('note'), suggest: val('suggest'), youthWorship: val('youthWorship') };
    }
    sending = true;
    btn.disabled = true; btn.textContent = isDept && photos.length ? '사진과 함께 보내는 중…' : '보내는 중…'; msg.className = 'msg';
    google.script.run
      .withSuccessHandler(r => {
        clearDraft(); document.getElementById('draft').classList.remove('show');
        loaded.overview = false; loaded.history = false;   // 다음에 열 때 새로 불러온다
        msg.className = 'msg ok'; msg.innerHTML = '🎉 ' + esc(r) + '<button type="button" class="ghost" data-go="history">📚 지난 보고에서 확인하기</button>';
        sending = false; sendLabel = '다시 보내기(수정)';
        btn.textContent = sendLabel; btn.disabled = false;
      })
      // 보내지 못하면 쓰신 글·고른 사진은 그대로 둔다(임시 저장도 지우지 않는다) — 다시 누르면 된다.
      .withFailureHandler(e => { msg.className = 'msg err'; msg.textContent = (e && e.message) || '보내지 못했습니다. 잠시 후 다시 눌러 주세요.'; sending = false; btn.textContent = sendLabel; btn.disabled = false; })
      .submitReport(p);
  });
}
});
</script>
</body>
</html>
